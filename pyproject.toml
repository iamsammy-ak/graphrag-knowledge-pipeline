[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "graphrag-knowledge-pipeline"
version = "0.1.0"
description = "Turn unstructured text into a knowledge graph and answer multi-hop questions with local, path and global graph search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["graphrag", "knowledge-graph", "rag", "entity-extraction", "networkx", "spacy", "multi-hop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "pydantic>=2.5",
  "spacy>=3.7,<4",
  "typer>=0.12",
  "rich>=13.0",
  "openai>=1.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
models = ["fastembed>=0.4"]
viz = ["matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "matplotlib>=3.7",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.scripts]
graphrag = "graphrag_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "models: needs downloaded embedding models (skipped when they are not available)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["graphrag_pipeline"]
ignore_missing_imports = true
warn_unused_ignores = true
